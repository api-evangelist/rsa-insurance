summary: >-
  There is no API lifecycle to record — RSA Insurance publishes no API, so no
  versioning scheme, no deprecation policy, no SLA and no status page exist.
  What does exist, and what any consumer of this record needs, is a brand and
  estate lifecycle: RSA is being retired in favour of Intact Insurance, and the
  hosts in this repository are moving underneath integrators one at a time.
