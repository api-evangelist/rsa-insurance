name: RSA Insurance
kind: company
description: >-
  RSA Insurance is a British property and casualty insurer whose lineage runs
  back to the Sun Fire Office of 1710, making it one of the oldest general
  insurance brands in the United Kingdom. It writes commercial lines through
  intermediaries — property, liability, motor fleet, marine, construction,
  engineering and renewable energy, cyber, professional and financial lines,
  rail, and accident and health — alongside a residual personal lines book.
  RSA Insurance Group was acquired by Intact Financial Corporation in 2021, and
  on 6 October 2025 RSA and NIG formally rebranded to Intact Insurance across
  the UK, Ireland and Europe; rsainsurance.co.uk now survives as a legacy
  broker-tools site while corporate, investor, careers and news content has
  moved to intactinsurance.co.uk. RSA has no public developer portal and
  publishes no self-serve API. developer., developers., docs. and api.
  subdomains do not serve (wildcard DNS resolves but no TLS service answers),
  and /developers, /api, /developer, /partners, /integrations and /brokers all
  return HTTP 404. Every integration surface is broker-gated behind a user ID
  and password issued to registered intermediaries: RSA Connect (the "Connect
  Intermediary Website"), RSA Online for intermediated personal home and
  commercial trading, RSA Claims Online, an eFNOL commercial property claims
  form, the MID2 Motor Insurance Database portal, and the RSAred risk
  management customer portal. Machine-to-machine trading reaches RSA the way it
  reaches most UK carriers — through broker software houses (Acturis, Applied,
  Open GI, SSP, Bravo Digital Trader) and the Polaris imarket commercial
  e-trading hub, which lists Intact among its participating insurers and runs
  on Polaris Standards rather than an openly documented carrier API. No ACORD,
  AL3, ACORD XML, NGDS or IVANS reference appears anywhere on RSA's public
  site, and no Lloyd's PPL, Whitespace or Blueprint Two participation was
  found. This is a partner-gated carrier with no public API surface.
