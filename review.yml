sources:
- url: https://www.rsainsurance.co.uk/brokers-and-partners/tools-resources/
  type: Documentation
  note: Enumerates every RSA broker tool — BPPP, commercial property eFNOL, MID2, RSA Claims Online, RSA Online, RSAred. Each states "User ID and password required" and several add "Available to brokers only."
- url: https://www.rsaconnect.rsagroup.co.uk/portal/UKHome.aspx
  type: Portal
  note: "Welcome to the Connect Intermediary Website ... Our online services such as Claims Online, Documents Online and MID Updates are available in this password protected area. If you are an insurance intermediary and require access please email your request to Intermediated.ebusiness@intactinsurance.co.uk, including your Name, contact details, Agency number."
- url: https://www.intactinsurance.co.uk/faqs/rsa-and-nig-are-now-intact-insurance
  type: Documentation
  note: >-
    Quote — "On 6 October 2025 RSA and NIG have officially rebranded to Intact
    Insurance across the UK, Ireland, and Europe." Page last updated 24 March
    2026.
- url: https://www.polaris.co.uk/products/imarket/
  type: Documentation
  note: imarket commercial e-trading hub. Lists Intact among participating insurers alongside Allianz, Arch, AXA, Aviva, NIG, QBE and Zurich, and lists Acturis, Applied, Bravo Digital Trader, Open GI and SSP as connected broker systems. No public developer documentation or OpenAPI.
- url: https://en.wikipedia.org/wiki/RSA_Insurance_Group
  type: Reference
  note: Company history and the 2021 Intact Financial Corporation acquisition.
actions:
  openapiPath: null
  apisYmlUpdated: true
  apisListed: 0
  reason: |
    apis[] is intentionally empty. RSA Insurance documents no public API, so
    there is nothing honest to list. Recording the absence — a broker-gated UK
    carrier whose only machine integration path is a software house or the
    Polaris imarket hub, with no ACORD reference of any kind — is the finding.
