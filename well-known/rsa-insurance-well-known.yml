generated: '2026-07-25'
method: searched
source: live probes of every RSA / Intact Insurance UK host in apis.yml
summary: >-
  No /.well-known/ document is served by RSA Insurance on any host. The legacy
  brand site, the successor Intact Insurance UK site and the RSA Online broker
  trading platform all return HTTP 404 for every discovery path probed. The RSA
  Connect intermediary portal answers HTTP 200 to every path, but that is a
  catch-all: www.rsaconnect.rsagroup.co.uk now 302s to
  www.connect.intactinsurance.co.uk, whose ASP.NET front controller rewrites any
  unknown path to /ErrorPage.aspx with the plain-text body
  "Security Error!.. Invalid URL or Invalid data". None of those 200s is a
  document. No security.txt, no OIDC or OAuth authorization-server metadata, no
  api-catalog, no ai-plugin.json and no llms.txt exist anywhere.
  Recording the absence is the finding; no raw files were saved because nothing
  was served.
files_saved: []
pointer_wired: false
pointer_note: >-
  Deliberately NOT wired as `type: WellKnown` in apis.yml. This is a record of
  absence, and a WellKnown pointer would falsely assert that RSA serves a
  well-known discovery catalog. Kept in the repository so a later round does not
  have to re-probe.
